services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orvyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orvyn
      POSTGRES_PASSWORD: orvyn_secret
      POSTGRES_DB: orvyn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvyn -d orvyn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orvyn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
